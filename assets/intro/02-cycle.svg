<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
<rect width="1280" height="760" rx="28" fill="#f7f9fc"/><rect x="18" y="18" width="1244" height="724" rx="24" fill="white" stroke="#d8e0ea" stroke-width="3"/>
<text x="60" y="90" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#17365d">Производственный цикл</text>
<text x="60" y="128" font-family="Arial,sans-serif" font-size="18" fill="#64748b">От задания до готового изделия</text>

<g font-family="Arial,sans-serif">
<rect x="60" y="210" width="210" height="210" rx="22" fill="#eef4fb" stroke="#9eb6d2" stroke-width="2"/><circle cx="92" cy="244" r="17" fill="#5279a8"/><text x="92" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="white">1</text><text x="82" y="292" font-size="24" font-weight="700" fill="#17365d">Задание</text><text x="82" y="330" font-size="17" fill="#40566f">Требования к продукту</text><text x="82" y="356" font-size="17" fill="#40566f">и результату</text>
<rect x="300" y="210" width="210" height="210" rx="22" fill="#eef4fb" stroke="#9eb6d2" stroke-width="2"/><circle cx="332" cy="244" r="17" fill="#5279a8"/><text x="332" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="white">2</text><text x="322" y="292" font-size="24" font-weight="700" fill="#17365d">Подготовка</text><text x="322" y="330" font-size="17" fill="#40566f">Материал, формы,</text><text x="322" y="356" font-size="17" fill="#40566f">рабочие условия</text>
<rect x="540" y="210" width="210" height="210" rx="22" fill="#eef4fb" stroke="#9eb6d2" stroke-width="2"/><circle cx="572" cy="244" r="17" fill="#5279a8"/><text x="572" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="white">3</text><text x="562" y="292" font-size="24" font-weight="700" fill="#17365d">Приладка</text><text x="562" y="330" font-size="17" fill="#40566f">Первый результат</text><text x="562" y="356" font-size="17" fill="#40566f">и корректировки</text>
<rect x="780" y="210" width="210" height="210" rx="22" fill="#eef4fb" stroke="#9eb6d2" stroke-width="2"/><circle cx="812" cy="244" r="17" fill="#5279a8"/><text x="812" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="white">4</text><text x="802" y="292" font-size="24" font-weight="700" fill="#17365d">Тираж</text><text x="802" y="330" font-size="17" fill="#40566f">Стабильный выпуск</text><text x="802" y="356" font-size="17" fill="#40566f">годной продукции</text>
<rect x="1020" y="210" width="200" height="210" rx="22" fill="#eef4fb" stroke="#9eb6d2" stroke-width="2"/><circle cx="1052" cy="244" r="17" fill="#5279a8"/><text x="1052" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="white">5</text><text x="1042" y="292" font-size="24" font-weight="700" fill="#17365d">Контроль</text><text x="1042" y="330" font-size="17" fill="#40566f">Проверка</text><text x="1042" y="356" font-size="17" fill="#40566f">стабильности</text>
<rect x="390" y="500" width="500" height="145" rx="22" fill="#edf7f3" stroke="#9fcdbd" stroke-width="2"/><circle cx="422" cy="535" r="17" fill="#4b8f77"/><text x="422" y="541" text-anchor="middle" font-size="15" font-weight="700" fill="white">6</text><text x="452" y="540" font-size="24" font-weight="700" fill="#235b4a">Готовое изделие</text><text x="452" y="576" font-size="17" fill="#456b61">Передача на следующий передел или выпуск</text>
<path d="M270 315H300M510 315H540M750 315H780M990 315H1020M1120 420V470H890" stroke="#7f9ab6" stroke-width="4" fill="none"/><path d="M390 470H260V315H270" stroke="#7f9ab6" stroke-width="4" fill="none"/>
<text x="60" y="700" font-family="Arial,sans-serif" font-size="16" fill="#6b7d91">На каждом этапе есть входные условия, действие и проверяемый результат.</text>
</g></svg>