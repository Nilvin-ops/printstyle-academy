<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" fill="#ffffff"/>
<rect x="28" y="28" width="1144" height="594" rx="28" fill="#f7fafc" stroke="#d7e2ed" stroke-width="2"/>
<text x="70" y="72" font-family="Arial,Segoe UI,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#183b63">Печатная секция</text><text x="70" y="108" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#60758b">Форма → полотно → лист</text>
<rect x="90" y="220" width="240" height="180" rx="18" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="210.0" y="262" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Форма</text><text x="210.0" y="295" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">несёт изображение</text><rect x="480" y="220" width="240" height="180" rx="18" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="600.0" y="262" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Офсетное полотно</text><text x="600.0" y="295" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">промежуточный перенос</text><rect x="870" y="220" width="240" height="180" rx="18" fill="#f7fafc" stroke="#b9cbe0" stroke-width="3"/><text x="990.0" y="262" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Лист</text><text x="990.0" y="295" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">готовый перенос</text><line x1="335" y1="310" x2="475" y2="310" stroke="#2476d2" stroke-width="7" stroke-linecap="round"/><polygon points="475,310 457,300 457,320" fill="#2476d2"/><line x1="725" y1="310" x2="865" y2="310" stroke="#2476d2" stroke-width="7" stroke-linecap="round"/><polygon points="865,310 847,300 847,320" fill="#2476d2"/><text x="600" y="500" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#58708a">Функции цилиндров и валов рассматриваются как одна цепочка переноса</text>
