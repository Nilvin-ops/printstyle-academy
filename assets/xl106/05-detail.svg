<text x="70" y="72" font-family="Arial,Segoe UI,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#183b63">Путь листа и захват</text><text x="70" y="108" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#60758b">Передача листа между секциями</text>
<g><rect x="90" y="350" width="1020" height="150" rx="20" fill="#dce4eb" stroke="#718398" stroke-width="4"/><rect x="130" y="375" width="120" height="100" rx="12" fill="#f8fbfd" stroke="#91a2b4" stroke-width="4"/><text x="190" y="417" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#183b63">Подача</text><rect x="300" y="375" width="120" height="100" rx="12" fill="#dff0ff" stroke="#2476d2" stroke-width="4"/><text x="360" y="417" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#183b63">Секция 1</text><rect x="470" y="375" width="120" height="100" rx="12" fill="#f8fbfd" stroke="#91a2b4" stroke-width="4"/><text x="530" y="417" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#183b63">Секция 2</text><rect x="640" y="375" width="120" height="100" rx="12" fill="#f8fbfd" stroke="#91a2b4" stroke-width="4"/><text x="700" y="417" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#183b63">Секция 3</text><rect x="810" y="375" width="120" height="100" rx="12" fill="#f8fbfd" stroke="#91a2b4" stroke-width="4"/><text x="870" y="417" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#183b63">Секция 4</text><rect x="980" y="375" width="120" height="100" rx="12" fill="#f8fbfd" stroke="#91a2b4" stroke-width="4"/><text x="1040" y="417" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#183b63">Вывод</text><line x1="105" y1="515" x2="1090" y2="515" stroke="#2476d2" stroke-width="5" stroke-linecap="round"/><polygon points="1090,515 1072,505 1072,525" fill="#2476d2"/></g><rect x="400" y="175" width="400" height="105" rx="18" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="600.0" y="217" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Захват</text><text x="600.0" y="250" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">фиксирует кромку листа</text><line x1="600" y1="290" x2="600" y2="345" stroke="#2476d2" stroke-width="7" stroke-linecap="round"/><polygon points="600,345 582,335 582,355" fill="#2476d2"/><text x="600" y="545" font-family="Arial,Segoe UI,sans-serif" font-size="23" font-weight="700" text-anchor="middle" fill="#183b63">Стабильная траектория = стабильная геометрия листа</text>
