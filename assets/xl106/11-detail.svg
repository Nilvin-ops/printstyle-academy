<rect x="28" y="28" width="1144" height="594" rx="28" fill="#f7fafc" stroke="#d7e2ed" stroke-width="2"/>
<text x="70" y="72" font-family="Arial,Segoe UI,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#183b63">Баланс краска — увлажнение</text><text x="70" y="108" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="500" text-anchor="start" fill="#60758b">Два потока, один стабильный отпечаток</text>
<rect x="100" y="210" width="300" height="190" rx="18" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="250.0" y="252" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Краска</text><text x="250.0" y="285" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">цветовая плотность</text><rect x="450" y="210" width="300" height="190" rx="18" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="600.0" y="252" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Баланс</text><text x="600.0" y="285" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">стабильный процесс</text><rect x="800" y="210" width="300" height="190" rx="18" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="950.0" y="252" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#183b63">Увлажнение</text><text x="950.0" y="285" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#58708a">пробельные участки</text><line x1="405" y1="305" x2="445" y2="305" stroke="#2476d2" stroke-width="7" stroke-linecap="round"/><polygon points="445,305 427,295 427,315" fill="#2476d2"/><line x1="755" y1="305" x2="795" y2="305" stroke="#2476d2" stroke-width="7" stroke-linecap="round"/><polygon points="795,305 777,295 777,315" fill="#2476d2"/><text x="600" y="510" font-family="Arial,Segoe UI,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#183b63">Изменение одного фактора требует повторной проверки результата</text>
