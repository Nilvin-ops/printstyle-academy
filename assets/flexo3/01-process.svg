<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
<rect width="1200" height="700" rx="34" fill="#f7f8fa"/>
<text x="70" y="78" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111827">Логика флексографского процесса</text>
<text x="70" y="112" font-family="Arial,sans-serif" font-size="15" fill="#667085">PrintStyle Academy · Основы флексографской печати</text><rect x="70" y="180" width="230" height="150" rx="20" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/><text x="92" y="222" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Рулон</text><text x="92" y="252" font-family="Arial,sans-serif" font-size="15" fill="#667085">Материал движется непрерывным</text><text x="92" y="275" font-family="Arial,sans-serif" font-size="15" fill="#667085">полотном</text><rect x="485" y="180" width="230" height="150" rx="20" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/><text x="507" y="222" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Дозирование</text><text x="507" y="252" font-family="Arial,sans-serif" font-size="15" fill="#667085">Анилокc и ракель формируют</text><text x="507" y="275" font-family="Arial,sans-serif" font-size="15" fill="#667085">слой краски</text><rect x="900" y="180" width="230" height="150" rx="20" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/><text x="922" y="222" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Форма</text><text x="922" y="252" font-family="Arial,sans-serif" font-size="15" fill="#667085">Рельефные элементы получают</text><text x="922" y="275" font-family="Arial,sans-serif" font-size="15" fill="#667085">краску</text><rect x="485" y="430" width="230" height="150" rx="20" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/><text x="507" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Материал</text><text x="507" y="502" font-family="Arial,sans-serif" font-size="15" fill="#667085">Изображение переносится на</text><text x="507" y="525" font-family="Arial,sans-serif" font-size="15" fill="#667085">основу</text><rect x="900" y="430" width="230" height="150" rx="20" fill="#ffffff" stroke="#cfd4dc" stroke-width="2"/><text x="922" y="472" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#1f2937">Контроль</text><text x="922" y="502" font-family="Arial,sans-serif" font-size="15" fill="#667085">Приводка, цвет и качество</text><text x="922" y="525" font-family="Arial,sans-serif" font-size="15" fill="#667085">проверяются</text><path d="M 308 255.0 L 471 255.0" stroke="#7b8794" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 723 255.0 L 886 255.0" stroke="#7b8794" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M 723 505.0 L 886 505.0" stroke="#7b8794" stroke-width="3" fill="none" marker-end="url(#arrow)"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs><text x="70" y="655" font-family="Arial,sans-serif" font-size="15" fill="#475467">Материал → дозирование → форма → перенос → контроль</text></svg>