"#555">Шаг 2 — определить повторяемость</text><text x="580" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Шаг 3 — локализовать</text><text x="810" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Шаг 4 — изменить и проверить</text><text x="60" y="575" font-family="Arial,sans-serif" font-size="14" fill="#777">Учебная визуализация; не заменяет руководство и локальную инструкцию по конкретной комплектации.</text></svg>