<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#fff"/><rect x="28" y="28" width="1144" height="594" rx="28" fill="#f7fafc" stroke="#d7e2ed" stroke-width="2"/><text x="70" y="72" font-family="Arial,Segoe UI,sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#183b63">Подача листа и приводка</text><text x="70" y="108" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="500" text-anchor="start" fill="#60758b">Повторяемое положение листа перед печатью</text><rect x="100" y="220" width="270" height="190" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="3"/><text x="235.0" y="270" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#183b63">Лист</text><text x="235.0" y="308" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#60758b">позиция</text><rect x="465" y="180" width="270" height="270" rx="20" fill="#eef6ff" stroke="#2476d2" stroke-width="3"/><text x="600.0" y="230" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#183b63">Приводка</text><text x="600.0" y="268" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#60758b">точное совмещение</text><rect x="830" y="220" width="270" height="190" rx="20" fill="#ffffff" stroke="#b9cbe0" stroke-width="3"/><text x="965.0" y="270" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#183b63">Оттиск</text><text x="965.0" y="308" font-family="Arial,Segoe UI,sans-serif" font-size="18" font-weight="500" text-anchor="middle" fill="#60758b">положение изображения</text><line x1="375" y1="315" x2="460" y2="315" stroke="#2476d2" stroke-width="7" stroke-linecap="round"/><polygon points="460,315 442,305 442,325" fill="#2476d2"/><line x1="740" y1="315" x2="825" y2="315" stroke="#