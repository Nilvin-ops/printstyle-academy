<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f7f7f5"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#161616">XL 105 · Выход на тиражный режим: от хорошего листа к стабильной серии</text><text x="60" y="88" font-family="Arial,sans-serif" font-size="16" fill="#666">Уникальная учебная визуализация урока 16</text><rect x="130" y="120" width="470" height="350" rx="18" fill="#fff" stroke="#222" stroke-width="4"/><rect x="180" y="175" width="370" height="80" fill="none" stroke="#555" stroke-width="3"/><rect x="180" y="280" width="170" height="130" fill="none" stroke="#555" stroke-width="3"/><rect x="380" y="280" width="170" height="130" fill="none" stroke="#555" stroke-width="3"/><path d="M700 180 H1080 M700 250 H1080 M700 320 H1080 M700 390 H1080" stroke="#777" stroke-width="6"/><circle cx="740" cy="180" r="12" fill="#222"/><circle cx="740" cy="250" r="12" fill="#222"/><circle cx="740" cy="320" r="12" fill="#222"/><circle cx="740" cy="390" r="12" fill="#222"/><text x="120" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Один лист — только начало</text><text x="350" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Что меняется во время выхода</text><text x="580" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Контрольная серия</text><text x="810" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Когда можно считать процесс устойч</text><text x="60" y="575" font-family="Arial,sans-serif" font-size="14" fill="#777">Учебная визуализация; не заменяет руководство и локальную инструкцию по конкретной комплектации.</text></svg>