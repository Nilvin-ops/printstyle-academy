<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f7f7f5"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#161616">XL 105 · Лакировальная секция XL 105</text><text x="60" y="88" font-family="Arial,sans-serif" font-size="16" fill="#666">Уникальная учебная визуализация урока 21</text><rect x="110" y="150" width="500" height="300" rx="18" fill="none" stroke="#222" stroke-width="4"/><path d="M160 250 H560" stroke="#555" stroke-width="8"/><circle cx="230" cy="250" r="55" fill="none" stroke="#222" stroke-width="5"/><circle cx="390" cy="250" r="55" fill="none" stroke="#222" stroke-width="5"/><path d="M610 250 H760" stroke="#555" stroke-width="10"/><polygon points="760,250 740,238 740,262" fill="#555"/><rect x="790" y="170" width="280" height="160" rx="14" fill="none" stroke="#222" stroke-width="4"/><path d="M820 210 H1040 M820 250 H1040 M820 290 H1040" stroke="#777" stroke-width="6"/><path d="M810 370 Q930 310 1050 370" fill="none" stroke="#222" stroke-width="5"/><text x="120" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Зачем нужен лак</text><text x="350" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Лакировальная секция как отдельная</text><text x="580" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Что влияет на результат</text><text x="810" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Контроль покрытия</text><text x="60" y="575" font-family="Arial,sans-serif" font-size="14" fill="#777">Учебная визуализация; не заменяет руководство и локальную инструкцию по конкретной комплектации.</text></svg>