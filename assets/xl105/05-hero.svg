<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f7f7f5"/><text x="60" y="58" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#161616">XL 105 · Печатная секция XL 105: из каких узлов складывается печать</text><text x="60" y="88" font-family="Arial,sans-serif" font-size="16" fill="#666">Уникальная учебная визуализация урока 5</text><circle cx="280" cy="310" r="120" fill="none" stroke="#222" stroke-width="6"/><circle cx="600" cy="310" r="120" fill="none" stroke="#222" stroke-width="6"/><circle cx="920" cy="310" r="120" fill="none" stroke="#222" stroke-width="6"/><path d="M350 250 H530 M670 250 H850" stroke="#555" stroke-width="12"/><path d="M350 370 H530 M670 370 H850" stroke="#555" stroke-width="12"/><rect x="190" y="155" width="180" height="55" rx="10" fill="none" stroke="#222" stroke-width="3"/><rect x="510" y="155" width="180" height="55" rx="10" fill="none" stroke="#222" stroke-width="3"/><rect x="830" y="155" width="180" height="55" rx="10" fill="none" stroke="#222" stroke-width="3"/><text x="120" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Три цилиндра как основа офсета</text><text x="350" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Красочная и увлажняющая системы</text><text x="580" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Что видит оператор</text><text x="810" y="515" font-family="Arial,sans-serif" font-size="15" fill="#555">Главный принцип</text><text x="60" y="575" font-family="Arial,sans-serif" font-size="14" fill="#777">Учебная визуализация; не заменяет руководство и локальную инструкцию по конкретной комплектации.</text></svg>