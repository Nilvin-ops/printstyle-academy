<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#ffffff"/><text x="70" y="70" font-size="34" font-weight="700" fill="#111827">Растровая точка: как печатается полутон</text><text x="70" y="112" font-size="18" fill="#64748b">Ключевые элементы темы</text><rect x="70" y="180" width="310" height="210" rx="24" fill="#f7f9fc" stroke="#cbd5e1"/><circle cx="112" cy="222" r="22" fill="#172033"/><text x="112" y="229" text-anchor="middle" fill="white" font-size="18" font-weight="700">1</text><text x="94" y="270" font-size="20" fill="#172033">Полутона формируются растровой</text><text x="94" y="270" font-size="20" fill="#172033">структурой.</text><rect x="440" y="180" width="310" height="210" rx="24" fill="#f7f9fc" stroke="#cbd5e1"/><circle cx="482" cy="222" r="22" fill="#172033"/><text x="482" y="229" text-anchor="middle" fill="white" font-size="18" font-weight="700">2</text><text x="464" y="270" font-size="20" fill="#172033">Растискивание изменяет</text><text x="464" y="270" font-size="20" fill="#172033">воспроизведение точки.</text><rect x="810" y="180" width="310" height="210" rx="24" fill="#f7f9fc" stroke="#cbd5e1"/><circle cx="852" cy="222" r="22" fill="#172033"/><text x="852" y="229" text-anchor="middle" fill="white" font-size="18" font-weight="700">3</text><text x="834" y="270" font-size="20" fill="#172033">Контрольные шкалы помогают</text><text x="834" y="270" font-size="20" fill="#172033">оценивать процесс независимо</text><text x="834" y="270" font-size="20" fill="#172033">от сюжета.</text></svg>