<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#ffffff"/><text x="50" y="70" font-size="34" font-weight="700" fill="#111827">Красочная система: как краска приходит к форме</text><text x="50" y="112" font-size="18" fill="#64748b">Логика процесса</text><rect x="50" y="185" width="245" height="190" rx="24" fill="#f7f9fc" stroke="#cbd5e1"/><text x="72" y="225" font-size="18" font-weight="700" fill="#475569">ЭТАП 1</text><text x="72" y="265" font-size="19" fill="#111827">Краска распределяется</text><text x="72" y="265" font-size="19" fill="#111827">системой валиков до</text><text x="72" y="265" font-size="19" fill="#111827">формы.</text><path d="M 295 280 H 335" stroke="#64748b" stroke-width="4"/><path d="M 325 270 L 340 280 L 325 290" fill="none" stroke="#64748b" stroke-width="4"/><rect x="335" y="185" width="245" height="190" rx="24" fill="#f7f9fc" stroke="#cbd5e1"/><text x="357" y="225" font-size="18" font-weight="700" fill="#475569">ЭТАП 2</text><text x="357" y="265" font-size="19" fill="#111827">Подача по ширине влияет</text><text x="357" y="265" font-size="19" fill="#111827">на равномерность слоя.</text><path d="M 580 280 H 620" stroke="#64748b" stroke-width="4"/><path d="M 610 270 L 625 280 L 610 290" fill="none" stroke="#64748b" stroke-width="4"/><rect x="620" y="185" width="245" height="190" rx="24" fill="#f7f9fc" stroke="#cbd5e1"/><text x="642" y="225" font-size="18" font-weight="700" fill="#475569">ЭТАП 3</text><text x="642" y="265" font-size="19" fill="#111827">Отпечаток — главный</text><text x="642" y="265" font-size="19" fill="#111827">результат работы</text><text x="642" y="265" font-size="19" fill="#111827">красочной системы.</text><path d="M 865 280 H 905" stroke="#64748b" stroke-width="4"/><path d="M 895 270 L 910 280 L 895 290" fill="none" stroke="#64748b" stroke-width="4"/></svg>