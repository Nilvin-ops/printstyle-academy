<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">От файла к готовому оттиску</text>
<g font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><rect x="70" y="170" width="180" height="110" rx="18" fill="#eaf2ff" stroke="#9ebce0"/><text x="160" y="220">Файл</text><text x="160" y="250" font-size="16" font-weight="400">данные заказа</text>
<rect x="300" y="170" width="180" height="110" rx="18" fill="#eef8f1" stroke="#a8d3b6"/><text x="390" y="220">Форма</text><text x="390" y="250" font-size="16" font-weight="400">C / M / Y / K</text>
<rect x="530" y="170" width="180" height="110" rx="18" fill="#fff5df" stroke="#e6c57b"/><text x="620" y="220">Печать</text><text x="620" y="250" font-size="16" font-weight="400">краска + вода + контакт</text>
