<rect x="990" y="170" width="140" height="110" rx="18" fill="#eef4f7" stroke="#b5c8d3"/><text x="1060" y="220">Тираж</text><text x="1060" y="250" font-size="16" font-weight="400">стабильный результат</text></g>
<g stroke="#6d8daa" stroke-width="5" fill="none"><path d="M250 225h45"/><path d="M480 225h45"/><path d="M710 225h45"/><path d="M940 225h45"/></g>
<g font-family="Arial" font-size="18" fill="#526b82"><text x="75" y="370">Главная идея: каждый следующий этап зависит от предыдущего.</text><text x="75" y="410">Ошибка, возникшая до печати, может проявиться уже на готовом листе.</text></g></svg>