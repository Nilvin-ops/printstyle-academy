<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Растискивание: расчётная точка и отпечаток</text>
<g font-family="Arial" text-anchor="middle"><text x="300" y="150" font-size="20" font-weight="700" fill="#17344e">На форме</text><text x="900" y="150" font-size="20" font-weight="700" fill="#17344e">На оттиске</text><g fill="#17344e"><circle cx="250" cy="260" r="18"/><circle cx="300" cy="260" r="18"/><circle cx="350" cy="260" r="18"/><circle cx="250" cy="310" r="18"/><circle cx="300" cy="310" r="18"/><circle cx="350" cy="310" r="18"/><circle cx="250" cy="360" r="18"/><circle cx="300" cy="360" r="18"/><circle cx="350" cy="360" r="18"/></g><g fill="#17344e"><circle cx="820" cy="245" r="28"/><circle cx="880" cy="245" r="28"/><circle cx="940" cy="245" r="28"/><circle cx="820" cy="305" r="28"/><circle cx="880" cy="305" r="28"/><circle cx="940" cy="305" r="28"/><circle cx="820" cy="365" r="28"/><circle cx="880" cy="365" r="28"/><circle cx="940" cy="365" r="28"/></g><path d="M390 310H780" stroke="#557b99" stroke-width="7"/><text x="585" y="290" font-size="18" fill="#526b82">бумага + краска + давление</text></g>
<text x="100" y="475" font-family="Arial" font-size="18" fill="#526b82">Фактическая точка может стать больше расчётной. Поэтому тон изображения контролируют по шкалам и измерениям.</text></svg>