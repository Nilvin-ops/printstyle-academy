<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Баланс серого: три канала должны давать нейтральный результат</text>
<g font-family="Arial" text-anchor="middle"><rect x="100" y="165" width="260" height="260" rx="18" fill="#eef2f5" stroke="#b5c2cc"/><text x="230" y="215" font-size="22" font-weight="700" fill="#17344e">Нейтральный серый</text><rect x="150" y="270" width="160" height="90" rx="10" fill="#8f9499"/><rect x="470" y="165" width="260" height="260" rx="18" fill="#fff4f4" stroke="#dfb0b4"/><text x="600" y="215" font-size="22" font-weight="700" fill="#7c2f38">Тёплый сдвиг</text><rect x="520" y="270" width="160" height="90" rx="10" fill="#9d8580"/><rect x="840" y="165" width="260" height="260" rx="18" fill="#f2f4ff" stroke="#b4bce0"/><text x="970" y="215" font-size="22" font-weight="700" fill="#334a8a">Холодный сдвиг</text><rect x="890" y="270" width="160" height="90" rx="10" fill="#858f9f"/></g>
<text x="100" y="500" font-family="Arial" font-size="18" fill="#526b82">Серое поле чувствительно к относительному балансу C, M и Y и помогает увидеть цветовой сдвиг.</text></svg>