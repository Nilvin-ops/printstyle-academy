<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Офсетное полотно: промежуточный перенос</text>
<g font-family="Arial" text-anchor="middle"><rect x="100" y="180" width="250" height="160" rx="20" fill="#e7edf2" stroke="#9badbb"/><text x="225" y="245" font-size="23" font-weight="700" fill="#17344e">ФОРМА</text><text x="225" y="280" font-size="17" fill="#526b82">тонкий красочный слой</text><rect x="475" y="150" width="250" height="220" rx="35" fill="#d9dee2" stroke="#788a98"/><rect x="515" y="205" width="170" height="110" rx="55" fill="#4e6675"/><text x="600" y="267" font-size="22" font-weight="700" fill="white">ПОЛОТНО</text><rect x="850" y="180" width="250" height="160" rx="20" fill="#fffdf4" stroke="#d8c995"/><text x="975" y="245" font-size="23" font-weight="700" fill="#17344e">ЛИСТ</text><text x="975" y="280" font-size="17" fill="#526b82">итоговый оттиск</text></g>
<g stroke="#607f96" stroke-width="7"><path d="M350 260H465"/><path d="M735 260H840"/></g><g font-family="Arial" font-size="18" fill="#526b82"><text x="100" y="445">Эластичная поверхность принимает изображение с формы и переносит его на материал.</text><text x="100" y="485">Состояние полотна влияет на качество переноса и повторяемость результата.</text></g></svg>