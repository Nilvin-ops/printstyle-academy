<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">ΔE: расстояние между эталоном и отпечатком</text>
<g font-family="Arial"><circle cx="330" cy="300" r="90" fill="#6b8fc1"/><circle cx="820" cy="250" r="90" fill="#b65b7d"/><line x1="400" y1="270" x2="750" y2="280" stroke="#17344e" stroke-width="5" stroke-dasharray="14 10"/><text x="330" y="425" text-anchor="middle" font-size="21" font-weight="700" fill="#17344e">Эталон</text><text x="820" y="395" text-anchor="middle" font-size="21" font-weight="700" fill="#17344e">Отпечаток</text><rect x="485" y="205" width="190" height="80" rx="16" fill="#fff" stroke="#9db0bf"/><text x="580" y="255" text-anchor="middle" font-size="30" font-weight="800" fill="#17344e">ΔE</text><text x="100" y="500" font-size="18" fill="#526b82">Чем больше рассчитанное различие, тем дальше измеренный цвет от выбранного эталона.</text><text x="100" y="535" font-size="18" fill="#526b82">Но решение о допуске принимает стандарт/заказ, а не само число ΔE.</text></g></svg>