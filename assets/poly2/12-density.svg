<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Оптическая плотность: число вместо «кажется темнее»</text>
<g font-family="Arial" text-anchor="middle"><rect x="100" y="160" width="280" height="240" rx="18" fill="#f1f4f7" stroke="#aebdca"/><text x="240" y="210" font-size="22" font-weight="700" fill="#17344e">Плашка</text><rect x="150" y="250" width="180" height="90" rx="10" fill="#2a3138"/><text x="240" y="380" font-size="16" fill="#526b82">образец / контрольное поле</text><path d="M380 280H510" stroke="#557b99" stroke-width="7"/><rect x="510" y="145" width="230" height="270" rx="30" fill="#e8edf2" stroke="#8e9daa"/><rect x="560" y="205" width="130" height="130" rx="18" fill="#fff" stroke="#b3c1cc"/><text x="625" y="275" font-size="34" font-weight="800" fill="#17344e">D</text><text x="625" y="305" font-size="18" fill="#526b82">измерение</text><path d="M740 280H870" stroke="#557b99" stroke-width="7"/><rect x="870" y="160" width="260" height="240" rx="18" fill="#eef8f1" stroke="#a8d3b6"/><text x="1000" y="220" font-size="22" font-weight="700" fill="#214b36">СРАВНЕНИЕ</text><text x="1000" y="270" font-size="18" fill="#526b82">целевое значение</text><text x="1000" y="305" font-size="18" fill="#526b82">↓</text><text x="1000" y="345" font-size="18" fill="#526b82">фактическое значение</text></g>
<text x="100" y="480" font-family="Arial" font-size="18" fill="#526b82">Плотность полезна не сама по себе: её сравнивают в одинаковых условиях и в контексте материала и краски.</text></svg>