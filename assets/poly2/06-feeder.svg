<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Подача листа: от стопы до точной позиции</text>
<g font-family="Arial" text-anchor="middle"><rect x="90" y="240" width="180" height="180" rx="16" fill="#eef2f5" stroke="#a8b7c2"/><text x="180" y="320" font-size="21" font-weight="700" fill="#17344e">СТОПА</text><text x="180" y="350" font-size="16" fill="#526b82">листов</text><path d="M270 330H390" stroke="#557b99" stroke-width="7"/><rect x="390" y="210" width="180" height="240" rx="18" fill="#eaf4fb" stroke="#a9c9df"/><text x="480" y="295" font-size="21" font-weight="700" fill="#244c6b">ЗАХВАТ</text><text x="480" y="330" font-size="16" fill="#526b82">разделение</text><text x="480" y="355" font-size="16" fill="#526b82">и транспорт</text><path d="M570 330H690" stroke="#557b99" stroke-width="7"/><rect x="690" y="210" width="180" height="240" rx="18" fill="#eef8f1" stroke="#a8d3b6"/><text x="780" y="295" font-size="21" font-weight="700" fill="#214b36">ВЫРАВНИВАНИЕ</text><text x="780" y="330" font-size="16" fill="#526b82">точная позиция</text><path d="M870 330H990" stroke="#557b99" stroke-width="7"/><rect x="990" y="240" width="120" height="180" rx="16" fill="#fff5df" stroke="#e5c77f"/><text x="1050" y="320" font-size="20" font-weight="700" fill="#62491e">ПЕЧАТЬ</text></g>
<text x="100" y="505" font-family="Arial" font-size="18" fill="#526b82">Если положение листа «плавает», цветовая настройка не устранит геометрическую причину.</text></svg>