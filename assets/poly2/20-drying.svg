<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Закрепление красочного слоя: от свежего отпечатка к готовому продукту</text>
<g font-family="Arial" text-anchor="middle"><rect x="100" y="180" width="220" height="190" rx="20" fill="#eef2f5" stroke="#aebdc8"/><text x="210" y="230" font-size="22" font-weight="700" fill="#17344e">СВЕЖИЙ СЛОЙ</text><rect x="145" y="270" width="130" height="55" rx="8" fill="#2c3944"/><text x="210" y="360" font-size="16" fill="#526b82">уязвим к контакту</text><path d="M320 275H440" stroke="#557b99" stroke-width="7"/><rect x="440" y="160" width="300" height="230" rx="25" fill="#fff5df" stroke="#e6c57b"/><text x="590" y="220" font-size="22" font-weight="700" fill="#62491e">ЗАКРЕПЛЕНИЕ</text><path d="M520 315 C550 250 590 350 620 280 S690 250 710 310" fill="none" stroke="#c68a3d" stroke-width="8"/><text x="590" y="360" font-size="16" fill="#526b82">механизм зависит от системы</text><path d="M740 275H860" stroke="#557b99" stroke-width="7"/><rect x="860" y="180" width="250" height="190" rx="20" fill="#eef8f1" stroke="#a8d3b6"/><text x="985" y="230" font-size="22" font-weight="700" fill="#214b36">ГОТОВЫЙ СЛОЙ</text><text x="985" y="285" font-size="16" fill="#526b82">может идти дальше</text><text x="985" y="315" font-size="16" fill="#526b82">в резку / фальцовку</text></g>
<text x="100" y="480" font-family="Arial" font-size="18" fill="#526b82">Свойства бумаги, краски и оборудования определяют, как и насколько быстро слой закрепляется.</text></svg>