<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Контроль качества: от признака к подтверждённому результату</text>
<g font-family="Arial" text-anchor="middle" font-weight="700"><rect x="70" y="190" width="180" height="100" rx="18" fill="#eaf2ff" stroke="#9ebce0"/><text x="160" y="235" font-size="20" fill="#17344e">1. Факт</text><text x="160" y="262" font-size="15" fill="#526b82">что изменилось?</text><rect x="290" y="190" width="180" height="100" rx="18" fill="#eef8f1" stroke="#a8d3b6"/><text x="380" y="235" font-size="20" fill="#17344e">2. Причина</text><text x="380" y="262" font-size="15" fill="#526b82">где искать?</text><rect x="510" y="190" width="180" height="100" rx="18" fill="#fff5df" stroke="#e6c57b"/><text x="600" y="235" font-size="20" fill="#17344e">3. Изменение</text><text x="600" y="262" font-size="15" fill="#526b82">одно действие</text><rect x="730" y="190" width="180" height="100" rx="18" fill="#f2ecff" stroke="#c7b2e9"/><text x="820" y="235" font-size="20" fill="#17344e">4. Проверка</text><text x="820" y="262" font-size="15" fill="#526b82">что получилось?</text><rect x="950" y="190" width="180" height="100" rx="18" fill="#eef4f7" stroke="#b5c8d3"/><text x="1040" y="235" font-size="20" fill="#17344e">5. Фиксация</text><text x="1040" y="262" font-size="15" fill="#526b82">что повторить?</text></g>
<g stroke="#6d8daa" stroke-width="5"><path d="M250 240H285M470 240H505M690 240H725M910 240H945"/></g><text x="100" y="390" font-family="Arial" font-size="18" fill="#526b82">Смысл контроля — не просто найти отклонение, а подтвердить, что результат после действия стал управляемым.</text></svg>