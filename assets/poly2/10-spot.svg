<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="#f7f9fc"/><rect x="28" y="28" width="1144" height="564" rx="26" fill="#fff" stroke="#dbe4ee" stroke-width="2"/>
<text x="70" y="86" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17344e">Процессные и смесевые цвета</text>
<g font-family="Arial" text-anchor="middle"><rect x="100" y="155" width="420" height="260" rx="22" fill="#f2f4f7" stroke="#aebdca"/><text x="310" y="205" font-size="25" font-weight="700" fill="#17344e">CMYK</text><circle cx="230" cy="300" r="58" fill="#19b8cf"/><circle cx="330" cy="300" r="58" fill="#d83283" fill-opacity=".9"/><circle cx="280" cy="355" r="58" fill="#f0cf32" fill-opacity=".9"/><text x="310" y="385" font-size="16" fill="#526b82">цвет строится каналами</text>
<rect x="650" y="155" width="420" height="260" rx="22" fill="#f7f1e7" stroke="#d7c18e"/><text x="860" y="205" font-size="25" font-weight="700" fill="#62491e">СМЕСЕВАЯ КРАСКА</text><rect x="760" y="255" width="200" height="95" rx="16" fill="#6f3b86"/><text x="860" y="310" font-size="20" font-weight="700" fill="white">1 отдельный цвет</text><text x="860" y="385" font-size="16" fill="#526b82">отдельная краска / канал</text></g>
<text x="100" y="500" font-family="Arial" font-size="18" fill="#526b82">Смесевая краска не является «ещё одним оттенком CMYK» — это отдельный производственный цвет.</text></svg>